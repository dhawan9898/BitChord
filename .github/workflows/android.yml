name: Android Release APK

# Every push to main builds one signed arm64 APK and publishes it as a new
# GitHub release: v1.0 first, then v1.0.1, v1.0.2, ... The base version lives
# in build.gradle.kts (baseVersionName); the number after it is how many
# releases of that base already exist, so each push is a distinct update.
# Signing uses the keystore committed under signing/ - no secrets needed.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'web/**'
      - 'backend/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a run half way through a release: a tag without its APK is worse
# than a queued run.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # the release notes list commits since the previous release

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # LASTFM_*/LISTEN_TOGETHER_SERVER are optional: when the repository has no
    # such secrets the values are blank and those two features stay off.
    - name: Write local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

    - name: Compute version
      run: |
        BASE=$(grep -oP 'val baseVersionName = "\K[0-9.]+' build.gradle.kts)
        if [ -z "$BASE" ]; then
          echo "::error::Could not read baseVersionName from build.gradle.kts"
          exit 1
        fi
        # Releases of this base so far: tags "v<base>" and "v<base>.<n>".
        PATTERN="^v${BASE//./\\.}(\\.[0-9]+)?$"
        N=$(git tag -l 'v*' | grep -Ec "$PATTERN" || true)
        if [ "$N" -eq 0 ]; then VERSION="$BASE"; else VERSION="${BASE}.${N}"; fi
        echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
        echo "BUILD_NUMBER=${N}" >> "$GITHUB_ENV"
        echo "Building ${VERSION} (release #$((N + 1)) of ${BASE})"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # build.gradle.kts reads BITCHORD_BUILD_NUMBER to stamp the version and code.
    - name: Build Signed Prod Release APK
      env:
        BITCHORD_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
      run: ./gradlew assembleProdRelease

    # Exactly one phone APK (arm64-v8a, no ABI splits, no universal build).
    - name: Collect the APK
      run: |
        mapfile -t APKS < <(ls app/build/outputs/apk/prod/release/*.apk)
        if [ "${#APKS[@]}" -ne 1 ]; then
          echo "::error::Expected exactly one APK, found ${#APKS[@]}: ${APKS[*]}"
          exit 1
        fi
        BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        "$BT/apksigner" verify --print-certs "${APKS[0]}"
        mkdir -p build-output
        cp "${APKS[0]}" "build-output/BitChord-v${VERSION}.apk"
        ls -lh build-output

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BitChord-v${{ env.VERSION }}
        path: build-output/BitChord-v${{ env.VERSION }}.apk
        retention-days: 30

    # Built by the same assembleProdRelease, with the same key. The phone APK
    # already carries the watch app inside it; this copy is kept as a workflow
    # artifact only (it is not a release asset, so a release stays one APK).
    - name: Upload Wear OS APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-wear-prod-release-signed
        path: wearos/build/outputs/apk/prod/release/*.apk

    # One release per push, tagged on the exact commit that was built. The
    # in-app updater reads the latest release and its BitChord-*.apk asset.
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ "$BUILD_NUMBER" -eq 0 ]; then
          {
            echo "## BitChord v${VERSION}"
            echo
            echo "First release of this build, tuned for a Galaxy S24 Ultra (arm64, Android 14 or newer)."
            echo
            echo "### What's in it"
            echo "- **One APK, arm64 only.** No per-CPU splits and no universal build, so the download is far smaller."
            echo "- **System font.** Text, the Replay poster and the home-screen widgets use the phone's own sans-serif; no font files are bundled."
            echo "- **Smaller app.** Release builds shrink unused resources, and the older-Android code paths are dropped."
            echo "- **Same features, same animations and glass effects** as before."
            echo "- **Updates from this repository.** The in-app updater now reads these releases, and every push to main publishes a new one (v1.0.1, v1.0.2, ...)."
            echo
            echo "### Install"
            echo "Download **BitChord-v${VERSION}.apk** below and install it. If the original BitChord is installed, uninstall it first: this build is signed with a different key."
          } > release-notes.md
        else
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then RANGE="${PREVIOUS}..HEAD"; else RANGE="-n 15"; fi
          {
            echo "## BitChord v${VERSION}"
            echo
            echo "Built from commit \`${GITHUB_SHA::7}\` on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "### Changes"
            git log $RANGE --no-merges --pretty='- %s' | head -n 30
            echo
            echo "### Install"
            echo "Download **BitChord-v${VERSION}.apk** below and install it over the previous version, or use the in-app update prompt."
          } > release-notes.md
        fi
        gh release create "v${VERSION}" "build-output/BitChord-v${VERSION}.apk" \
          --target "$GITHUB_SHA" \
          --title "BitChord v${VERSION}" \
          --notes-file release-notes.md \
          --latest
